spring.application.name=api-app-customer
spring.config.import=optional:file:.env.properties

# Database Configuration (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/graduation_project_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Server Port — App Customer API (Mobile)
server.port=9090

# Upload (avatar / images)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# JWT Configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Google OAuth2 Client ID
app.google.client-id=your-google-client-id.apps.googleusercontent.com

# PayOS Payout API (Kênh Chi - Rút tiền)
payos.client-id=${PAYOS_CLIENT_ID:}
payos.api-key=${PAYOS_API_KEY:}
payos.checksum-key=${PAYOS_CHECKSUM_KEY:}

# SePay (Kênh Thu - Nạp tiền qua chuyển khoản)
# QUAN TRỌNG: Thay bằng API key thật lấy từ dashboard SePay. KHÔNG được để trống.
sepay.account-no=${SEPAY_ACCOUNT_NO:}
sepay.bank-id=${SEPAY_BANK_ID:MB}
sepay.account-name=${SEPAY_ACCOUNT_NAME:}
sepay.api-key=${SEPAY_API_KEY:}

# Gemini AI (BE only — ưu tiên biến môi trường GEMINI_API_KEY)
gemini.api.key=${GEMINI_API_KEY:YOUR_GEMINI_API_KEY}
gemini.model=gemini-2.5-flash
